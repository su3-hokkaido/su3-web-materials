allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Wrangler's local runtime (`wrangler dev`), which serves the built site like Cloudflare does.
  workerd: true
  # Pulled in by @custom-elements-manifest/analyzer. Its postinstall only selects a prebuilt
  # platform binary; `pnpm run analyze` verifies it works without the script.
  rs-module-lexer: false
minimumReleaseAgeExclude:
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
