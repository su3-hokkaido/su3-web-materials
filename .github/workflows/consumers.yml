# Proves the packed package works for consumers: plain HTML, Vite, React 19 and Vue fixtures
# (tests/consumers, docs/project_plan.md sections 9 and 15). It installs from the npm registry and
# drives Chromium, so it is separate from `ci`. It also runs weekly to notice upstream changes in
# React, Vue, Vite and npm, and on demand.
name: Consumers

on:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumers:
    name: Consumer check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check the fixtures against the packed package
        run: pnpm run check:consumers
