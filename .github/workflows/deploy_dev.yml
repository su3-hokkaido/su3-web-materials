# develop -> the persistent preview Worker `${CLOUDFLARE_WORKER_NAME}-dev` on Cloudflare Workers
# (docs/project_plan.md sections 4 and 8). The deploy runs only after CI passes.
name: Deploy (development)

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: checks
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: development
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
