<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>su3-web-materials in plain HTML</title>
    <!-- No bundler: an import map resolves the bare specifiers (the exports map is not used). -->
    <script type="importmap">
      {
        "imports": {
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/",
          "su3-web-materials/button.js": "/node_modules/su3-web-materials/dist/shared/components/buttons/button/index.js",
          "su3-web-materials/all.js": "/node_modules/su3-web-materials/dist/shared/all.js"
        }
      }
    </script>
  </head>
  <body>
    <!--
      tokens.css is not loaded here on purpose: components carry built-in fallbacks, so the button
      is styled (default light look) without it.
    -->
    <su3-button id="subject">Save</su3-button>
    <script type="module">
      import 'su3-web-materials/button.js';
    </script>
  </body>
</html>
