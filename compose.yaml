services:
  # Storybook dev server (docs/project_plan.md section 5). Tool commands such as lint and test run
  # in one-off containers of this service through the Makefile, so they publish no ports and work
  # while `make up` is running.
  storybook:
    build:
      context: .
      target: dev
    init: true
    ports:
      # The container port is fixed; only the host side is configurable.
      - '${DEV_PORT:-5070}:5070'
    environment:
      PRODUCT_ID: ${PRODUCT_ID:-sample}
    # Chromium (Vitest Browser Mode) needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    volumes:
      - .:/app
      # Keeps Linux dependencies separate from any node_modules on the host.
      - node_modules:/app/node_modules

volumes:
  node_modules:
